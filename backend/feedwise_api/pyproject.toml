[project]
name = "feedwise-api"
version = "0.1.0"
description = "FeedWise FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.2",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-dotenv==1.0.1",
  "python-jose[cryptography]==3.3.0",
  "httpx==0.27.2",
  "supabase==2.7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
