# render.yaml — Deploy FeedWise API to Render.com
# Push this repo and connect to Render for free-tier hosting.

services:
  - type: web
    name: feedwise-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend/feedwise_api
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://feedwise-app.web.app,https://feedwise-studio.web.app"
